{% extends "admin/base.html" %}
{% block title %}修改密碼{% endblock %}
{% block content %}
<h1>修改後台密碼</h1>
<form method="post" class="edit-form narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>目前密碼<input type="password" name="old_password" autocomplete="current-password" required></label>
  <label>新密碼(至少 8 字元)<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label>
  <label>再輸入一次新密碼<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label>
  <div class="form-actions"><button class="btn btn-primary" type="submit">更新密碼</button></div>
</form>
{% endblock %}
