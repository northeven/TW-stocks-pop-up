<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0JHZZ4CNPW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-0JHZZ4CNPW');
  </script>
  <title>台股彈幕</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 行情資訊列 -->
  <header id="ticker">
    <nav id="channel-nav">
      <a href="/" data-channel="taiex">台股大盤</a>
      <a href="/tsm" data-channel="tsm">美股 TSM</a>
      <a
        id="credit"
        href="https://www.threads.com/@chan_yu_chen/post/DabzWHgkeve"
        target="_blank"
        rel="noopener noreferrer"
      >💡 靈感 by @chan_yu_chen</a>
    </nav>
    <div class="ticker-name">
      <span id="index-name">連線中…</span>
      <span id="source-badge" class="badge" hidden>模擬行情</span>
    </div>
    <div class="ticker-main">
      <span id="index-price">—</span>
      <span id="index-change" class="flat">—</span>
    </div>
    <div class="ticker-sub">
      <span>高 <b id="index-high">—</b></span>
      <span>低 <b id="index-low">—</b></span>
      <span>昨收 <b id="index-prev">—</b></span>
    </div>
    <p id="disclaimer">資料僅供參考、非即時交易依據</p>
  </header>

  <!-- 彈幕飛行區（背景是即時走勢圖） -->
  <main id="danmaku-stage" aria-live="off">
    <canvas id="chart" aria-label="大盤即時走勢圖"></canvas>
  </main>

  <!-- 房間資訊 + 輸入列 -->
  <footer id="composer">
    <span id="room-badge" class="badge">連線中…</span>
    <form id="barrage-form" autocomplete="off">
      <input
        id="barrage-input"
        type="text"
        maxlength="50"
        placeholder="發個彈幕吧（最多 50 字）"
      />
      <button type="submit">發射 🚀</button>
    </form>
  </footer>

  <div id="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
